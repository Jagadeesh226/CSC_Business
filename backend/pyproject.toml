[project]
name = "csc-business-crm-backend"
version = "0.1.0"
description = "CSC Business CRM API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.150.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
